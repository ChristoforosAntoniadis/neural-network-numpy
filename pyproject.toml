[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nn_numpy"
version = "1.0.0"
description = "A feed-forward neural network built with NumPy only, benchmarked on UCI classification and regression tasks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
# Runtime dependencies; requirements.txt pins the exact versions used for the results.
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "ucimlrepo==0.0.7",
]

[project.optional-dependencies]
# Development tools: install with  pip install -e ".[dev]"  (or  make requirements).
dev = [
    "pytest>=8",
    "ruff==0.16.10",
    # The knowledge base (tools/build_knowledge_base.py) and its tests.
    "rdflib==7.6.0",
    "owlrl==7.6.2",
    # Static type checker: make typecheck.
    "mypy==2.4.0",
]
# Libraries the NumPy network is compared against (nn_numpy.benchmarks).
# Install with  pip install -e ".[benchmarks]"  (or  make benchmark-requirements).
# scipy is pinned because newer releases require NumPy 2, which would replace
# the project's pinned NumPy 1.26.4.
benchmarks = [
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "tensorflow==2.21.0",
    "torch==2.14.1",
    # Hyperparameter tuning of the framework models (nn_numpy.benchmarks.tuning).
    "optuna==5.0.0",
]

[tool.setuptools.packages.find]
include = ["nn_numpy*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["nn_numpy", "tests", "tools"]
# tests/ has no __init__.py, yet tests/test_batchnorm.py imports tests.test_gradients: map files
# to modules from the repository root so each test file has a single module name.
explicit_package_bases = true
mypy_path = "."
# Strict about this project: every function must be fully annotated, and annotated bodies are
# checked.
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# A variable may be re-bound to a value of a different type (e.g. a list filtered down to its
# non-None items) without being renamed; local_partial_types is required by that option.
allow_redefinition_new = true
local_partial_types = true
# Lenient about libraries without type information (seaborn, scikit-learn, ucimlrepo, owlrl,
# parts of Keras...): their objects are treated as Any rather than reported.
ignore_missing_imports = true

[tool.ruff]
line-length = 99
src = ["nn_numpy"]
include = ["pyproject.toml", "nn_numpy/**/*.py", "tests/**/*.py", "tools/**/*.py"]

[tool.ruff.lint]
# Ruff's default rules (pyflakes and pycodestyle errors) plus import sorting,
# as in the Cookiecutter Data Science template.
extend-select = ["I"]
ignore = [
    # The config loader reports every invalid setting, including wrong
    # types, as ValueError ("this config is invalid"); the tests rely on it.
    "TRY004",
    # The run stamp is meant to be the local wall-clock time of the run.
    "DTZ005",
]

[tool.ruff.lint.per-file-ignores]
# The run log's file and streams stay open for the whole process and are closed
# by close_run_log() (at exit at the latest), so they can't be context managers.
"nn_numpy/runlog.py" = ["SIM115"]

[tool.ruff.lint.isort]
known-first-party = ["nn_numpy"]
force-sort-within-sections = true
